    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f7f9fc; color: #333; line-height: 1.6; }
    header { background: linear-gradient(135deg, #2c3e50, #1f5f85); color: white; padding: clamp(24px, 5vw, 48px) 20px; text-align: center; }
    h1 { margin: 0; font-size: clamp(1.55rem, 4vw, 2.4rem); line-height: 1.2; }
    nav { background: #34495e; padding: 12px 16px; text-align: center; display: flex; justify-content: center; gap: clamp(12px, 4vw, 42px); flex-wrap: wrap; }
    nav a { color: white; margin: 0; text-decoration: none; font-weight: bold; font-size: 1.05em; padding: 7px 0; }
    nav a:hover { text-decoration: underline; }
    main { padding: clamp(24px, 5vw, 40px) 20px; max-width: 1400px; margin: 0 auto; }
    section { margin-bottom: 120px; }
    h2 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; margin-bottom: 40px; }

    .instruction-text {
      font-size: clamp(1.2rem, 3vw, 1.8em);
      color: #2c3e50;
      margin-bottom: 50px;
      font-weight: 600;
      text-align: center;
    }
    .diagram-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
    .diagram-card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; text-align: center; transition: transform 0.2s, box-shadow 0.2s; min-height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    .diagram-card:hover { transform: translateY(-5px); box-shadow: 0 8px 18px rgba(0,0,0,0.12); }
    .diagram-card h3 { margin: 0; color: #2c3e50; line-height: 1.35; }
    .card-score { margin: 0; font-size: 0.9rem; color: #64748b; }
    .card-score strong { color: #237a4b; }

    .quiz-container { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 40px); align-items: start; margin-top: 40px; }
    .diagram-section { text-align: center; }
    .diagram-image { max-width: 100%; border: 2px solid #ddd; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .diagram-image:hover { cursor: zoom-in; }
    .answers-section { background: white; padding: clamp(18px, 3vw, 30px); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-height: 80vh; overflow-y: auto; }
    .input-group { margin-bottom: 18px; display: flex; align-items: center; }
    .input-group label { width: 50px; font-weight: bold; color: #2c3e50; font-size: 1.1em; }
    .input-group input { flex: 1; padding: 12px; font-size: 1em; border: 1px solid #ccc; border-radius: 4px; }
    .button-group { margin-top: 30px; text-align: center; }
    button { padding: 12px 25px; font-size: 1.1em; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 8px 10px; transition: opacity 0.2s ease, transform 0.15s ease; }
    button:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .input-group input:focus { outline: 2px solid rgba(52, 152, 219, 0.35); border-color: #3498db; }
    .submit-btn { background: #27ae60; }
    .prev-btn { background: #95a5a6; display: none; }
    .retry-btn { background: #f39c12; display: none; }
    .next-btn { background: #3498db; display: none; }
    .home-btn { background: #34495e; }
    .feedback { margin-top: 30px; padding: clamp(16px, 3vw, 24px); border-radius: 12px; background: #ecf0f1; grid-column: 1 / -1; }
    .review-heading { margin: 0 0 14px; color: #2c3e50; }
    .review-summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .review-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
    .review-table th, .review-table td { padding: 11px 12px; text-align: left; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    .review-table th { background: #dfeaf2; color: #2c3e50; }
    .review-table tr:last-child td { border-bottom: 0; }
    .review-correct { color: #237a4b; font-weight: bold; }
    .review-incorrect { color: #c0392b; font-weight: bold; }
    .score { font-size: 1.4em; font-weight: bold; margin: 24px 0; text-align: center; color: #2c3e50; grid-column: 1 / -1; }
    .progress-text { color: #64748b; font-size: 0.95rem; text-align: center; margin: 10px 0 0; }

    @media (max-width: 900px) {
      .quiz-container { grid-template-columns: 1fr; }
      .answers-section { max-height: none; }
    }
    @media (max-width: 520px) {
      nav { justify-content: stretch; }
      nav a { flex: 1 1 100%; text-align: center; }
      section { margin-bottom: 64px; }

      .button-group { display: grid; grid-template-columns: 1fr; gap: 4px; }
      button { width: 100%; margin: 5px 0; }
      .input-group { align-items: stretch; flex-direction: column; gap: 5px; }
      .input-group label { width: auto; }
      .review-table { display: block; overflow-x: auto; white-space: normal; }

    const state = {

    function loadScores() {
      const fallback = {};
      try {
        const saved = window.localStorage.getItem('ais-dfd-scores');
        if (!saved) return fallback;
        const parsed = JSON.parse(saved);
        return parsed && typeof parsed === 'object' ? parsed : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function saveScores() {
      try {
        window.localStorage.setItem('ais-dfd-scores', JSON.stringify(state.scores));
      } catch (error) {
        // Scores remain available for the current page even when storage is blocked.
      }
    }

    function scoreKey(type, diag) {
      return `${type}-${diag.id}`;
    }

    function normalize(value) {
      if (value === null || value === undefined) return "";

      const normalized = String(value)
        .trim()
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]+/g, " ")
        .trim();

      if (!normalized) return "";

      const words = normalized.split(/\s+/).map(word => {
        if (word.endsWith("ies") && word.length > 3) return word.slice(0, -3) + "y";
        if (word.endsWith("sses") && word.length > 4) return word.slice(0, -2);
        if (word.endsWith("s") && word.length > 2 && !word.endsWith("ss")) return word.slice(0, -1);
        return word;
      });

      return words.join("");
    }

    function getAnswerOptions(answer) {
      return Array.isArray(answer) ? answer.filter(Boolean) : [answer].filter(Boolean);
    }

    function formatDisplayAnswer(answer) {
      const options = getAnswerOptions(answer);
      return options.length > 1 ? options.join(" or ") : options[0] || "";
    }

    function matchesAnswer(userInput, correctAnswer) {
      const normalizedInput = normalize(userInput);
      return getAnswerOptions(correctAnswer).some(option => normalize(option) === normalizedInput);
    }

    function renderDiagramList(targetId, diagrams, startQuizFn) {
      const list = document.getElementById(targetId);
      list.innerHTML = '';

      if (!diagrams.length) {
        list.innerHTML = '<p style="text-align:center;color:#666;font-size:1.2em;">No diagrams added yet.</p>';
        return;
      }

      diagrams.forEach((diag, index) => {
        const card = document.createElement('div');
        card.className = 'diagram-card';
        const savedScore = state.scores[scoreKey(targetId === 'practice-list' ? 'practice' : 'past', diag)];
        const scoreText = savedScore
          ? `<p class="card-score"><strong>Best: ${savedScore.correct}/${savedScore.total}</strong> (${savedScore.percent}%)</p>`
          : '<p class="card-score">Not attempted yet</p>';
        card.innerHTML = `<h3>${index + 1}. ${diag.title}</h3>${scoreText}`;
        card.onclick = () => startQuizFn(index);
        list.appendChild(card);
      });
    }

          if (event.key === 'Enter') {
            event.preventDefault();
            checkQuizAnswers(type, diag);
          }
        });
      });
    }

    function checkQuizAnswers(type, diag) {
      const index = type === 'practice' ? state.practiceIndex : state.pastIndex;
      const diagramsArray = type === 'practice' ? practiceDiagrams : pastDiagrams;
      const feedback = document.getElementById(`${type}-feedback`);
      const textInputMap = {};
      let correctCount = 0;
      const results = [];

      diag.labels.forEach(label => {
        const input = document.getElementById(`${type}-${label}`);
        textInputMap[label] = normalize(input.value);
        input.disabled = true;
      });

      feedback.innerHTML = '<h3>Results:</h3>';

      diag.labels.forEach(label => {
        const currentAnswer = diag.answers[label];
        const correctOptions = getAnswerOptions(currentAnswer);
        let isCorrect = correctOptions.some(option => normalize(option) === textInputMap[label]);

        if (!isCorrect && Array.isArray(diag.interchangeable)) {
          for (const pair of diag.interchangeable) {
            if (!pair.includes(label)) continue;

            const otherLabel = pair.find(item => item !== label);
            if (!otherLabel || !diag.answers[otherLabel]) continue;

            const thisLabelOptions = correctOptions.map(option => normalize(option));
            const otherLabelOptions = getAnswerOptions(diag.answers[otherLabel]).map(option => normalize(option));

            if (thisLabelOptions.includes(textInputMap[otherLabel]) && otherLabelOptions.includes(textInputMap[label])) {
              isCorrect = true;
              break;
            }
          }
        }

        const displayAnswer = formatDisplayAnswer(diag.answers[label]);
        if (isCorrect) correctCount += 1;
        results.push({
          label,
          submitted: textInputMap[label] ? document.getElementById(`${type}-${label}`).value : 'No answer',
          correct: displayAnswer,
          isCorrect
        });
      });

      const percent = Math.round((correctCount / diag.labels.length) * 100);
      const key = scoreKey(type, diag);
      const previous = state.scores[key];
      if (!previous || correctCount > previous.correct) {
        state.scores[key] = { correct: correctCount, total: diag.labels.length, percent };
        saveScores();
      }

      const score = document.getElementById(`${type}-score`);
      score.textContent = `You got ${correctCount} out of ${diag.labels.length} correct (${percent}%).`;
      score.style.display = 'block';

      const submit = document.getElementById(`${type}-submit`);
      const retry = document.getElementById(`${type}-retry`);
      const review = document.getElementById(`${type}-review`);
      const prev = document.getElementById(`${type}-prev`);
      const next = document.getElementById(`${type}-next`);

      feedback.innerHTML = `
        <div class="review-summary">
          <h3 class="review-heading">Answer review</h3>
          <span>${correctCount} correct · ${diag.labels.length - correctCount} to revisit</span>
        </div>
        <div id="${type}-review-content" style="display:none;"></div>
      `;
      const reviewContent = document.getElementById(`${type}-review-content`);
      const table = document.createElement('table');
      table.className = 'review-table';
      table.innerHTML = '<thead><tr><th>Label</th><th>Your answer</th><th>Correct answer</th><th>Status</th></tr></thead>';
      const body = document.createElement('tbody');
      results.forEach(result => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${result.label}</strong></td>
          <td>${result.submitted || 'No answer'}</td>
          <td>${result.correct}</td>
          <td class="${result.isCorrect ? 'review-correct' : 'review-incorrect'}">${result.isCorrect ? 'Correct' : 'Review'}</td>
        `;
        body.appendChild(row);
      });
      table.appendChild(body);
      reviewContent.appendChild(table);
      review.style.display = 'inline-block';
      review.onclick = () => {
        const isHidden = reviewContent.style.display === 'none';
        reviewContent.style.display = isHidden ? 'block' : 'none';
        review.textContent = isHidden ? 'Hide Review' : 'Review Answers';
        if (isHidden) reviewContent.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };

      submit.style.display = 'none';
      retry.style.display = 'inline-block';
      retry.onclick = () => (type === 'practice' ? startPracticeQuiz(index) : startPastQuiz(index));

      if (index > 0) {
        prev.style.display = 'inline-block';
        prev.onclick = () => (type === 'practice' ? startPracticeQuiz(index - 1) : startPastQuiz(index - 1));
      }

      if (index < diagramsArray.length - 1) {
        next.textContent = 'Next Diagram →';
        next.onclick = () => (type === 'practice' ? startPracticeQuiz(index + 1) : startPastQuiz(index + 1));
        next.style.display = 'inline-block';
      } else {
        next.textContent = 'Finish & Back to Menu';
        next.onclick = () => backToList(type);
        next.style.display = 'inline-block';
      }
    }

    function backToList(type) {
      if (type === 'practice') {
        document.getElementById('practice-quiz').style.display = 'none';
        document.getElementById('practice-intro').style.display = 'block';
        document.getElementById('past-exams').style.display = 'block';
        renderDiagramList('practice-list', practiceDiagrams, startPracticeQuiz);
      } else {
        document.getElementById('past-quiz').style.display = 'none';
        document.getElementById('past-intro').style.display = 'block';
        document.getElementById('dfd-practice').style.display = 'block';
        renderDiagramList('past-list', pastDiagrams, startPastQuiz);
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.querySelector('nav a[href="#dfd-practice"]').addEventListener('click', (event) => {
      event.preventDefault();
      document.getElementById('past-exams').style.display = 'none';
      document.getElementById('dfd-practice').style.display = 'block';
      document.getElementById('practice-intro').style.display = 'block';
      document.getElementById('practice-quiz').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.querySelector('nav a[href="#past-exams"]').addEventListener('click', (event) => {
      event.preventDefault();
      document.getElementById('dfd-practice').style.display = 'none';
      document.getElementById('past-exams').style.display = 'block';
      document.getElementById('past-intro').style.display = 'block';
      document.getElementById('past-quiz').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    renderDiagramList('practice-list', practiceDiagrams, startPracticeQuiz);
    renderDiagramList('past-list', pastDiagrams, startPastQuiz);
  </script>
</body>
</html>
